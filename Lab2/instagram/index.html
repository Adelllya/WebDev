<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">
    <div class="logo">
        <img src="" height="50px">
    </div>
    <div class="container">
        <div class="ichigo-left-hand">
            <img src="inst-logo.png" class="ichigos-inst">
            <h1 class="ichigo">See everyday moments from your<span class="ichigo2"> close friends</span>.</h1>
            <img src="inst.webp" class="bleach-logo">
        </div>
        <div class="right">
            <div class="login-part">
                <p class="orihime">Log in to Instagram</p>
                <input type="text" placeholder="Mobile number, username or email address">
                <input type="password" placeholder="Password">
                <button class="login">Log in</button>
                <a href="#">Forgotten password?</a>
            </div>
            <div class="other-part">
                <div class="facebook">
                    <a href="#">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Facebook_Logo_%282019%29.png/500px-Facebook_Logo_%282019%29.png" height="20px">
                        <p>Log in with Facebook</p>
                    </a>
                </div>
                <button class="new-acc">Create new account</button>
                <div class="meta">
                        <img src="" height="30px">
                        <p class="meta">Meta</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-links">
            <a href="#">Meta</a>
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Jobs</a>
            <a href="#">Help</a>
            <a href="#">API</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Locations</a>
            <a href="#">Instagram Life</a>
            <a href="#">Meta AI</a>
            <a href="#">Threads</a>
            <a href="#">Contact uploading and non-users</a>
            <a href="#">Meta Verified</a>
        </div>
        <div class="footer-meta">© 2026 Instagram from Meta</div>
    </footer>

</body>
</html>
