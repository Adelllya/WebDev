<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Project: Event invite</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: rgb(245, 248, 255);
                margin: 0;
                padding: 20px;
            }
            
            .card {
                background: white;
                border: 2px solid rgb(30, 60, 120);
                border-radius: 12px;
                padding: 16px;
                max-width: 520px;
            }
            
            .rsvp {
                display: inline-block;
                background: rgb(30, 60, 120);
                color: white;
                text-decoration: none;
                padding: 10px 14px;
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
        
        <div class="card">
            <h1>You're invited!</h1>
            <img src="https://www.bunsinmyoven.com/wp-content/uploads/2022/06/thumb-1.jpg" width="250px">
            <h2>Movie Night + Snacks</h2>
            
            <p><strong>The details:</strong></p>
            <ul>
                <li><strong>Date:</strong> Saturday, 7:00 PM</li>
                <li><strong>Place:</strong> My place (Almaty)</li>
                <li><strong>Dress code:</strong> Cozy pajamas</li>
                <li><strong>Bring:</strong> Your favorite snack</li>
            </ul>
            
            <p><em>RSVP by Friday</em></p>
            <a class="rsvp" href="#">RSVP</a>
        </div>
        
    </body>
</html>
